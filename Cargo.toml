[workspace]
resolver = "3"
members = ["crates/core", "crates/dest-local", "crates/dest-drive", "crates/cli", "src-tauri"]
default-members = ["crates/core", "crates/dest-local", "crates/dest-drive", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.100"
publish = false

[workspace.dependencies]
xkyhold-core = { path = "crates/core" }
aes-gcm = "0.11"
argon2 = "0.6"
base64 = "0.23"
flate2 = "1"
getrandom = "0.4"
hex = "0.4"
hkdf = "0.13"
hmac = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
unicode-normalization = "0.1"
zeroize = { version = "1", features = ["derive"] }
rustix = { version = "1", features = ["fs", "process"] }
uzers = "0.12"
tempfile = "3"
clap = { version = "4", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
strip = true
